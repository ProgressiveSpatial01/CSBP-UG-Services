// Measurement tool
let measurePoints = [];
let measurePolygon = null;
let measureLine = null;
let measuring = false;
let measureMode = null; // 'distance' or 'area'

document.getElementById('measure-distance').addEventListener('click', function() {
    if (measureMode === 'distance' && measuring) {
        // Stop measuring
        stopMeasuring();
    } else {
        // Start distance measuring
        startMeasuring('distance');
    }
});

document.getElementById('measure-area').addEventListener('click', function() {
    if (measureMode === 'area' && measuring) {
        // Stop measuring
        stopMeasuring();
    } else {
        // Start area measuring
        startMeasuring('area');
    }
});

document.getElementById('measure-clear').addEventListener('click', function() {
    clearMeasurement();
});

function startMeasuring(mode) {
    clearMeasurement();
    measuring = true;
    measureMode = mode;
    
    // Update button states
    const distBtn = document.getElementById('measure-distance');
    const areaBtn = document.getElementById('measure-area');
    
    if (mode === 'distance') {
        distBtn.textContent = 'Stop';
        distBtn.style.background = '#ff6600';
        areaBtn.style.background = '#0080ff';
        areaBtn.textContent = 'Area';
        document.getElementById('measure-result').textContent = 'Click points on map';
    } else {
        areaBtn.textContent = 'Stop';
        areaBtn.style.background = '#ff6600';
        distBtn.style.background = '#0080ff';
        distBtn.textContent = 'Distance';
        document.getElementById('measure-result').textContent = 'Click to draw polygon';
    }
}

function stopMeasuring() {
    measuring = false;
    
    // Reset button states
    const distBtn = document.getElementById('measure-distance');
    const areaBtn = document.getElementById('measure-area');
    distBtn.style.background = '#0080ff';
    areaBtn.style.background = '#0080ff';
    distBtn.textContent = 'Distance';
    areaBtn.textContent = 'Area';
}

function clearMeasurement() {
    measurePoints = [];
    measuring = false;
    measureMode = null;
    
    if (measureLine && map.getLayer('measure-line')) {
        map.removeLayer('measure-line');
        map.removeSource('measure-line');
        measureLine = null;
    }
    
    if (measurePolygon && map.getLayer('measure-polygon')) {
        map.removeLayer('measure-polygon');
        map.removeLayer('measure-polygon-outline');
        map.removeSource('measure-polygon');
        measurePolygon = null;
    }
    
    document.getElementById('measure-result').textContent = '';
    document.getElementById('measure-clear').disabled = true;
    
    // Reset buttons
    document.getElementById('measure-distance').style.background = '#0080ff';
    document.getElementById('measure-area').style.background = '#0080ff';
    document.getElementById('measure-distance').textContent = 'Distance';
    document.getElementById('measure-area').textContent = 'Area';
}

map.on('click', function(e) {
    if (!measuring) return;
    
    measurePoints.push([e.lngLat.lng, e.lngLat.lat]);
    
    if (measureMode === 'distance') {
        // Distance measurement
        if (measurePoints.length >= 2) {
            updateDistanceMeasurement();
        }
    } else if (measureMode === 'area') {
        // Area measurement
        if (measurePoints.length >= 3) {
            updateAreaMeasurement();
        }
    }
    
    document.getElementById('measure-clear').disabled = false;
});

function updateDistanceMeasurement() {
    let totalDistance = 0;
    
    for (let i = 0; i < measurePoints.length - 1; i++) {
        const lon1 = measurePoints[i][0];
        const lat1 = measurePoints[i][1];
        const lon2 = measurePoints[i + 1][0];
        const lat2 = measurePoints[i + 1][1];
        
        const R = 6371000; // Earth radius in meters
        const φ1 = lat1 * Math.PI / 180;
        const φ2 = lat2 * Math.PI / 180;
        const Δφ = (lat2 - lat1) * Math.PI / 180;
        const Δλ = (lon2 - lon1) * Math.PI / 180;
        
        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        
        totalDistance += R * c;
    }
    
    // Update line
    if (measureLine && map.getSource('measure-line')) {
        map.getSource('measure-line').setData({
            'type': 'Feature',
            'geometry': {
                'type': 'LineString',
                'coordinates': measurePoints
            }
        });
    } else {
        map.addSource('measure-line', {
            'type': 'geojson',
            'data': {
                'type': 'Feature',
                'geometry': {
                    'type': 'LineString',
                    'coordinates': measurePoints
                }
            }
        });
        
        map.addLayer({
            'id': 'measure-line',
            'type': 'line',
            'source': 'measure-line',
            'paint': {
                'line-color': '#ff0000',
                'line-width': 3,
                'line-dasharray': [2, 2]
            }
        });
        
        measureLine = true;
    }
    
    document.getElementById('measure-result').textContent = `Distance: ${totalDistance.toFixed(3)} m`;
}

        });
        
        map.addLayer({
            'id': 'measure-polygon',
            'type': 'fill',
            'source': 'measure-polygon',
            'paint': {
                'fill-color': '#ff0000',
                'fill-opacity': 0.2
            }
        });
        
        map.addLayer({
            'id': 'measure-polygon-outline',
            'type': 'line',
            'source': 'measure-polygon',
            'paint': {
                'line-color': '#ff0000',
                'line-width': 3,
                'line-dasharray': [2, 2]
            }
        });
        
        measurePolygon = true;
    }
    
    document.getElementById('measure-result').textContent = `Area: ${area.toFixed(3)} m²`;
}

function calculatePolygonArea(coords) {
    // Calculate area in square meters using spherical excess formula
    // This is accurate for small areas
    
    if (coords.length < 3) return 0;
    
    let total = 0;
    
    for (let i = 0; i < coords.length; i++) {
        const j = (i + 1) % coords.length;
        const lon1 = coords[i][0] * Math.PI / 180;
        const lat1 = coords[i][1] * Math.PI / 180;
        const lon2 = coords[j][0] * Math.PI / 180;
        const lat2 = coords[j][1] * Math.PI / 180;
        
        total += (lon2 - lon1) * (2 + Math.sin(lat1) + Math.sin(lat2));
    }
    
    total = Math.abs(total * 6371000 * 6371000 / 2);
    
    return total;
}
        
// Load all service layers
Object.keys(layerConfig).forEach(groupName => {
    const group = layerConfig[groupName];
    
    // Function to load a layer
    const loadLayer = function(layer) {
        const layerId = layer.name.replace(/\s+/g, '-').toLowerCase();
        
        // Load the GeoJSON
        fetch(layer.file)
            .then(response => response.text())
            .then(text => {
                // Extract JSON from the var declaration
                const jsonText = text.substring(text.indexOf('{'));
                const data = JSON.parse(jsonText);
                
                // Add source
                map.addSource(layerId, {
                    'type': 'geojson',
                    'data': data
                });
                
                // Add layer
                map.addLayer({
                    'id': layerId,
                    'type': 'line',
                    'source': layerId,
                    'layout': {
                        'visibility': layer.visible ? 'visible' : 'none',
                        'line-join': 'round',
                        'line-cap': 'round'
                    },
                    'paint': {
                        'line-color': layer.color,
                        'line-width': 3
                    }
                });
                
                // Add click handler for popups
                map.on('click', layerId, function(e) {
                    const props = e.features[0].properties;
                    
                    let popupHTML = `<h4>${layer.name}</h4>`;
                    
                    if (props.ServiceAtt_Asset_Owner) {
                        popupHTML += `<div class="popup-row"><span class="popup-label">Owner:</span><span class="popup-value">${props.ServiceAtt_Asset_Owner}</span></div>`;
                    }
                    if (props.ServiceAtt_Material) {
                        popupHTML += `<div class="popup-row"><span class="popup-label">Material:</span><span class="popup-value">${props.ServiceAtt_Material}</span></div>`;
                    }
                    if (props.ServiceAtt_Size) {
                        popupHTML += `<div class="popup-row"><span class="popup-label">Size:</span><span class="popup-value">${props.ServiceAtt_Size}</span></div>`;
                    }
                    if (props.ServiceAtt_SurveyType) {
                        popupHTML += `<div class="popup-row"><span class="popup-label">Survey Type:</span><span class="popup-value">${props.ServiceAtt_SurveyType}</span></div>`;
                    }
                    if (props.ServiceAtt_Class) {
                        popupHTML += `<div class="popup-row"><span class="popup-label">Class:</span><span class="popup-value">${props.ServiceAtt_Class}</span></div>`;
                    }
                    if (props.ServiceAtt_Locator) {
                        popupHTML += `<div class="popup-row"><span class="popup-label">Locator:</span><span class="popup-value">${props.ServiceAtt_Locator}</span></div>`;
                    }
                    
                    new mapboxgl.Popup()
                        .setLngLat(e.lngLat)
                        .setHTML(popupHTML)
                        .addTo(map);
                });
                
                // Change cursor on hover
                map.on('mouseenter', layerId, function() {
                    map.getCanvas().style.cursor = 'pointer';
                });
                
                map.on('mouseleave', layerId, function() {
                    map.getCanvas().style.cursor = '';
                });
            })
            .catch(error => {
                console.error(`Error loading ${layer.name}:`, error);
            });
    };
    
    // Load layers from group
    if (group.subgroups) {
        // Has subgroups - load from each subgroup
        Object.values(group.subgroups).forEach(subgroup => {
            subgroup.layers.forEach(layer => {
                loadLayer(layer);
            });
        });
    } else if (group.layers) {
        // No subgroups - load directly
        group.layers.forEach(layer => {
            loadLayer(layer);
        });
    }
});
        
        // Build layer control
        buildLayerControl();
    });
    
    function buildLayerControl() {
    const layerList = document.getElementById('layer-list');
    
    Object.keys(layerConfig).forEach(groupName => {
        const group = layerConfig[groupName];
        
        const groupDiv = document.createElement('div');
        groupDiv.className = 'layer-group';
        
        const groupTitle = document.createElement('div');
        groupTitle.className = 'layer-group-title';
        
        const titleText = document.createElement('span');
        titleText.textContent = groupName;
        
        const toggleIcon = document.createElement('span');
        toggleIcon.className = 'toggle-icon';
        toggleIcon.textContent = '▼';
        
        const toggleAllBtn = document.createElement('button');
        toggleAllBtn.className = 'group-toggle-all';
        toggleAllBtn.textContent = 'All On/Off';
        toggleAllBtn.onclick = function(e) {
            e.stopPropagation();
            toggleGroupLayers(groupName);
        };
        
        groupTitle.appendChild(titleText);
        groupTitle.appendChild(toggleAllBtn);
        groupTitle.appendChild(toggleIcon);
        
        const groupLayers = document.createElement('div');
        groupLayers.className = 'layer-group-layers';
        
        // Check if this group has subgroups
        if (group.subgroups) {
            Object.keys(group.subgroups).forEach(subgroupName => {
                const subgroup = group.subgroups[subgroupName];
                
                const subgroupDiv = document.createElement('div');
                subgroupDiv.className = 'subgroup';
                
                const subgroupTitle = document.createElement('div');
                subgroupTitle.className = 'subgroup-title collapsed';
                
                const subTitleText = document.createElement('span');
                subTitleText.textContent = subgroupName;
                
                const subToggleIcon = document.createElement('span');
                subToggleIcon.className = 'toggle-icon';
                subToggleIcon.textContent = '▼';
                
                const subToggleAllBtn = document.createElement('button');
                subToggleAllBtn.className = 'group-toggle-all';
                subToggleAllBtn.textContent = 'All';
                subToggleAllBtn.onclick = function(e) {
                    e.stopPropagation();
                    toggleSubgroupLayers(groupName, subgroupName);
                };
                
                subgroupTitle.appendChild(subTitleText);
                subgroupTitle.appendChild(subToggleAllBtn);
                subgroupTitle.appendChild(subToggleIcon);
                
                const subgroupLayers = document.createElement('div');
                subgroupLayers.className = 'subgroup-layers hidden';
                
                subgroup.layers.forEach(layer => {
                    addLayerToControl(subgroupLayers, layer);
                });
                
                subgroupTitle.onclick = function() {
                    subgroupLayers.classList.toggle('hidden');
                    subgroupTitle.classList.toggle('collapsed');
                };
                
                subgroupDiv.appendChild(subgroupTitle);
                subgroupDiv.appendChild(subgroupLayers);
                groupLayers.appendChild(subgroupDiv);
            });
        } else if (group.layers) {
            // No subgroups, just layers
            group.layers.forEach(layer => {
                addLayerToControl(groupLayers, layer);
            });
        }
        
        groupTitle.onclick = function() {
            groupLayers.classList.toggle('hidden');
            groupTitle.classList.toggle('collapsed');
        };
        
        groupDiv.appendChild(groupTitle);
        groupDiv.appendChild(groupLayers);
        layerList.appendChild(groupDiv);
    });
}

function addLayerToControl(container, layer) {
    const layerId = layer.name.replace(/\s+/g, '-').toLowerCase();
    
    const layerDiv = document.createElement('div');
    layerDiv.className = 'layer-item';
    
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.id = `toggle-${layerId}`;
    checkbox.checked = layer.visible;
    checkbox.addEventListener('change', function() {
        const visibility = this.checked ? 'visible' : 'none';
        if (map.getLayer(layerId)) {
            map.setLayoutProperty(layerId, 'visibility', visibility);
        }
    });
    
    const label = document.createElement('label');
    label.htmlFor = `toggle-${layerId}`;
    
    const colorIndicator = document.createElement('span');
    colorIndicator.className = 'color-indicator';
    colorIndicator.style.backgroundColor = layer.color;
    
    label.appendChild(colorIndicator);
    label.appendChild(document.createTextNode(layer.name));
    
    layerDiv.appendChild(checkbox);
    layerDiv.appendChild(label);
    container.appendChild(layerDiv);
}

function toggleGroupLayers(groupName) {
    const group = layerConfig[groupName];
    let allOn = true;
    
    // Check current state
    const checkStates = [];
    if (group.subgroups) {
        Object.values(group.subgroups).forEach(subgroup => {
            subgroup.layers.forEach(layer => {
                const layerId = layer.name.replace(/\s+/g, '-').toLowerCase();
                const checkbox = document.getElementById(`toggle-${layerId}`);
                if (checkbox) checkStates.push(checkbox.checked);
            });
        });
    } else if (group.layers) {
        group.layers.forEach(layer => {
            const layerId = layer.name.replace(/\s+/g, '-').toLowerCase();
            const checkbox = document.getElementById(`toggle-${layerId}`);
            if (checkbox) checkStates.push(checkbox.checked);
        });
    }
    
    allOn = checkStates.every(state => state === true);
    const newState = !allOn;
    
    // Toggle all layers
    if (group.subgroups) {
        Object.values(group.subgroups).forEach(subgroup => {
            subgroup.layers.forEach(layer => {
                const layerId = layer.name.replace(/\s+/g, '-').toLowerCase();
                const checkbox = document.getElementById(`toggle-${layerId}`);
                if (checkbox) {
                    checkbox.checked = newState;
                    if (map.getLayer(layerId)) {
                        map.setLayoutProperty(layerId, 'visibility', newState ? 'visible' : 'none');
                    }
                }
            });
        });
    } else if (group.layers) {
        group.layers.forEach(layer => {
            const layerId = layer.name.replace(/\s+/g, '-').toLowerCase();
            const checkbox = document.getElementById(`toggle-${layerId}`);
            if (checkbox) {
                checkbox.checked = newState;
                if (map.getLayer(layerId)) {
                    map.setLayoutProperty(layerId, 'visibility', newState ? 'visible' : 'none');
                }
            }
        });
    }
}

function toggleSubgroupLayers(groupName, subgroupName) {
    const subgroup = layerConfig[groupName].subgroups[subgroupName];
    let allOn = true;
    
    // Check current state
    const checkStates = [];
    subgroup.layers.forEach(layer => {
        const layerId = layer.name.replace(/\s+/g, '-').toLowerCase();
        const checkbox = document.getElementById(`toggle-${layerId}`);
        if (checkbox) checkStates.push(checkbox.checked);
    });
    
    allOn = checkStates.every(state => state === true);
    const newState = !allOn;
    
    // Toggle all
    subgroup.layers.forEach(layer => {
        const layerId = layer.name.replace(/\s+/g, '-').toLowerCase();
        const checkbox = document.getElementById(`toggle-${layerId}`);
        if (checkbox) {
            checkbox.checked = newState;
            if (map.getLayer(layerId)) {
                map.setLayoutProperty(layerId, 'visibility', newState ? 'visible' : 'none');
            }
        }
    });
}
