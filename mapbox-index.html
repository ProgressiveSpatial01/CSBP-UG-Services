        #layer-control {
    position: absolute;

    background: white;
    padding: 15px;
    border-radius: 8px;

#layer-control.hidden {

}

#layer-toggle {
    position: absolute;
    top: 10px;
    left: 10px;
    background: white;
    border: none;
    padding: 10px;
    border-radius: 4px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);

#layer-toggle.panel-open {

#layer-toggle:hover {

// Measurement tool
let measurePoints = [];
let measureLine = null;
let measuring = false;

document.getElementById('measure-start').addEventListener('click', function() {
    measuring = !measuring;
    this.textContent = measuring ? 'Click on Map' : 'Measure Distance';
    this.style.background = measuring ? '#ff6600' : '#0080ff';
    
    if (!measuring) {
        measurePoints = [];
        if (measureLine) {
            map.removeLayer('measure-line');
            map.removeSource('measure-line');
            measureLine = null;
        }
        document.getElementById('measure-result').textContent = '';
        document.getElementById('measure-clear').disabled = true;
    }
});

document.getElementById('measure-clear').addEventListener('click', function() {
    measurePoints = [];
    if (measureLine) {
        map.removeLayer('measure-line');
        map.removeSource('measure-line');
        measureLine = null;
    }
    document.getElementById('measure-result').textContent = '';
    this.disabled = true;
    measuring = false;
    document.getElementById('measure-start').textContent = 'Measure Distance';
    document.getElementById('measure-start').style.background = '#0080ff';
});

map.on('click', function(e) {
    if (!measuring) return;
    
    measurePoints.push([e.lngLat.lng, e.lngLat.lat]);
    
    if (measurePoints.length >= 2) {
        // Calculate distance using turf.js formula
        let totalDistance = 0;
        for (let i = 0; i < measurePoints.length - 1; i++) {
            const lon1 = measurePoints[i][0];
            const lat1 = measurePoints[i][1];
            const lon2 = measurePoints[i + 1][0];
            const lat2 = measurePoints[i + 1][1];
            
            const R = 6371000; // Earth radius in meters
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                    Math.cos(φ1) * Math.cos(φ2) *
                    Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            
            totalDistance += R * c;
        }
        
        // Update line
        if (measureLine) {
            map.getSource('measure-line').setData({
                'type': 'Feature',
                'geometry': {
                    'type': 'LineString',
                    'coordinates': measurePoints
                }
            });
        } else {
            map.addSource('measure-line', {
                'type': 'geojson',
                'data': {
                    'type': 'Feature',
                    'geometry': {
                        'type': 'LineString',
                        'coordinates': measurePoints
                    }
                }
            });
            
            map.addLayer({
                'id': 'measure-line',
                'type': 'line',
                'source': 'measure-line',
                'paint': {
                    'line-color': '#ff0000',
                    'line-width': 3,
                    'line-dasharray': [2, 2]
                }
            });
            
            measureLine = true;
        }
        
        document.getElementById('measure-result').textContent = `Distance: ${totalDistance.toFixed(3)} m`;
        document.getElementById('measure-clear').disabled = false;
    }
});

                fetch(layer.file)
                    .then(response => response.text())
                    .then(text => {
                        // Extract JSON from the var declaration
                        const jsonText = text.substring(text.indexOf('{'));
                        const data = JSON.parse(jsonText);
                        
                        // Add source
                        map.addSource(layerId, {
                            'type': 'geojson',
                            'data': data
                        });
                        
                        // Add layer
                        map.addLayer({
                            'id': layerId,
                            'type': 'line',
                            'source': layerId,
                            'layout': {
                                'visibility': layer.visible ? 'visible' : 'none',
                                'line-join': 'round',
                                'line-cap': 'round'
                            },
                            'paint': {
                                'line-color': layer.color,
                                'line-width': 3
                            }
                        });
                        
                        // Add click handler for popups
                        map.on('click', layerId, function(e) {
                            const props = e.features[0].properties;
                            
                            let popupHTML = `<h4>${layer.name}</h4>`;
                            
                            if (props.ServiceAtt_Asset_Owner) {
                                popupHTML += `<div class="popup-row"><span class="popup-label">Owner:</span><span class="popup-value">${props.ServiceAtt_Asset_Owner}</span></div>`;
                            }
                            if (props.ServiceAtt_Material) {
                                popupHTML += `<div class="popup-row"><span class="popup-label">Material:</span><span class="popup-value">${props.ServiceAtt_Material}</span></div>`;
                            }
                            if (props.ServiceAtt_Size) {
                                popupHTML += `<div class="popup-row"><span class="popup-label">Size:</span><span class="popup-value">${props.ServiceAtt_Size}</span></div>`;
                            }
                            if (props.ServiceAtt_SurveyType) {
                                popupHTML += `<div class="popup-row"><span class="popup-label">Survey Type:</span><span class="popup-value">${props.ServiceAtt_SurveyType}</span></div>`;
                            }
                            if (props.ServiceAtt_Class) {
                                popupHTML += `<div class="popup-row"><span class="popup-label">Class:</span><span class="popup-value">${props.ServiceAtt_Class}</span></div>`;
                            }
                            if (props.ServiceAtt_Locator) {
                                popupHTML += `<div class="popup-row"><span class="popup-label">Locator:</span><span class="popup-value">${props.ServiceAtt_Locator}</span></div>`;
                            }
                            
                            new mapboxgl.Popup()
                                .setLngLat(e.lngLat)
                                .setHTML(popupHTML)
                                .addTo(map);
                        });
                        
                        // Change cursor on hover
                        map.on('mouseenter', layerId, function() {
                            map.getCanvas().style.cursor = 'pointer';
                        });
                        
                        map.on('mouseleave', layerId, function() {
                            map.getCanvas().style.cursor = '';
                        });
                    })
                    .catch(error => {
                        console.error(`Error loading ${layer.name}:`, error);
                    });
            });
        });
        
        // Build layer control
        buildLayerControl();
    });
    
    function buildLayerControl() {
        const layerList = document.getElementById('layer-list');
        
        Object.keys(layerConfig).forEach(groupName => {
            const group = layerConfig[groupName];
            
            const groupDiv = document.createElement('div');
            groupDiv.className = 'layer-group';
            
            const groupTitle = document.createElement('div');
            groupTitle.className = 'layer-group-title';
            groupTitle.textContent = groupName;
            groupDiv.appendChild(groupTitle);
            
            const groupLayers = document.createElement('div');
            groupLayers.className = 'layer-group-layers';
            
            group.layers.forEach(layer => {
                const layerId = layer.name.replace(/\s+/g, '-').toLowerCase();
                
                const layerDiv = document.createElement('div');
                layerDiv.className = 'layer-item';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `toggle-${layerId}`;
                checkbox.checked = layer.visible;
                checkbox.addEventListener('change', function() {
                    const visibility = this.checked ? 'visible' : 'none';
                    if (map.getLayer(layerId)) {
                        map.setLayoutProperty(layerId, 'visibility', visibility);
                    }
                });
                
                const label = document.createElement('label');
                label.htmlFor = `toggle-${layerId}`;
                
                const colorIndicator = document.createElement('span');
                colorIndicator.className = 'color-indicator';
                colorIndicator.style.backgroundColor = layer.color;
                
                label.appendChild(colorIndicator);
                label.appendChild(document.createTextNode(layer.name));
                
                layerDiv.appendChild(checkbox);
                layerDiv.appendChild(label);
                groupLayers.appendChild(layerDiv);
            });
            
            groupDiv.appendChild(groupLayers);
            layerList.appendChild(groupDiv);
        });
    }
